version: '3.9'

services:
  # Backend Flask com Gunicorn
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: macrolab-backend
    ports:
      - "8081:8080"
    environment:
      - FLASK_ENV=production
      - PORT=8080
    volumes:
      - ./backend:/app/backend
      - ./macrolab:/app/macrolab
      - ./backend/models:/app/backend/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - macrolab-network
    command: gunicorn -w 4 -b 0.0.0.0:8080 --timeout 60 --access-logfile - --error-logfile - backend.app:app

  # Nginx como proxy reverso (opcional, para produção)
  nginx:
    image: nginx:alpine
    container_name: macrolab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - macrolab-network
    restart: unless-stopped

networks:
  macrolab-network:
    driver: bridge
